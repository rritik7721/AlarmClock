[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alarm"
version = "0.1.0"
description = "Alarm clock: pure-Python in-process scheduler."
requires-python = ">=3.10"

[project.scripts]
alarm = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "storage", "parsing", "notify", "ids", "scheduler"]